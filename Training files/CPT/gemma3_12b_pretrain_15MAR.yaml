### model
model_name_or_path: google/gemma-3-12b-pt  # Gemma 3 12B PT model
# attn_implementation: eager

trust_remote_code: true
### method
stage: pt
do_train: true
finetuning_type: full


# deepspeed
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: p2_phase2_code,p2_phase2_english,p2_phase2_jazz,p2_phase2_local,p2_phase2_stem_math,p2_phase2_urdunews
mix_strategy: concat
cutoff_len: 4096  

overwrite_cache: true
preprocessing_num_workers: 64
dataloader_num_workers: 4

### output
output_dir: saves/gemma3-12b-pt/full_pretrain
logging_steps: 10
save_steps: 300
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
max_grad_norm: 1.0  
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true  # Required to match DeepSpeed bf16.enabled
# pure_bf16: true  # Keep params in bf16 to avoid OOM (skips float32 upcasting)
ddp_timeout: 180000000
resume_from_checkpoint: null
ddp_find_unused_parameters: false

##handling OOM issues
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

use_fast_tokenizer: true
flash_attn: fa2
# flash_attn: disabled

packing: true

## eval
val_size: 0.001
eval_strategy: "steps"
eval_steps: 2000
per_device_eval_batch_size: 2
